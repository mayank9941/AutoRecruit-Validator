name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend (lint, typecheck, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # "build" runs tsc -b first, so this covers both the typecheck and
      # the production build.
      - name: Typecheck + build
        run: npm run build

  backend:
    name: Backend (install, import & boot check)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # The app connects to Postgres and creates its schema at import time,
    # so the boot check needs a real database.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ihmcl_hr
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/ihmcl_hr
      SECRET_KEY: ci-only-dummy-secret
      GEMINI_API_KEY: ci-only-dummy-key
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Syntax check all modules
        run: python -m compileall -q app scripts

      - name: App boot check (imports + DB schema creation)
        run: python -c "from app.main import app; print('app imports and schema creates OK')"
