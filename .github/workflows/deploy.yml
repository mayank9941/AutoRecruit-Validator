# CI/CD: every push to main is built & checked, then deployed to the GCP VM.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   VM_HOST     - the VM's static IP
#   VM_USER     - the SSH username on the VM (e.g. "developer")
#   VM_SSH_KEY  - private key whose public half is in ~/.ssh/authorized_keys
#                 on the VM (see DEPLOYMENT.md "CI/CD" section)

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}   # allows manual re-deploys from the Actions tab

concurrency:
  group: deploy-prod      # never run two deploys at once
  cancel-in-progress: false

jobs:
  checks:
    name: Build & compile checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend production build
        working-directory: frontend
        env:
          VITE_API_BASE_URL: /api
        run: |
          npm ci
          npm run build

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Backend compile check
        run: python -m compileall -q backend/app backend/scripts

  deploy:
    name: Deploy to VM
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - name: Pull & rebuild on the server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          command_timeout: 30m
          script: |
            set -e
            cd ~/AutoRecruit-Validator
            git pull --ff-only
            docker compose up -d --build
            docker image prune -f
            docker compose ps
